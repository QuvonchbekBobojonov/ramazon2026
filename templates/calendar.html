<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramazon 2026 Taqvim - {{ region|title }}</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Roboto:wght@400;500;700&display=swap');

        :root {
            --primary-color: #006400;
            /* Islamic Green */
            --accent-color: #D4AF37;
            /* Gold */
            --bg-color: #f8f9fa;
            --text-color: #333;
            --table-header-bg: #004d00;
            --table-row-even: #e8f5e9;
            --table-border: #c8e6c9;
            --today-bg: #fff9c4;
            /* Light Yellow for today */
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23006400' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
        }

        /* Watermark */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 3rem;
            font-weight: bold;
            color: rgba(0, 0, 0, 0.05);
            pointer-events: none;
            white-space: nowrap;
            z-index: 0;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 4px solid var(--accent-color);
        }

        h1 {
            font-family: 'Amiri', serif;
            margin: 0;
            font-size: 2rem;
            letter-spacing: 1px;
        }

        .region-badge {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-top: 5px;
            border: 1px solid var(--accent-color);
        }

        .calendar-table {
            width: 100%;
            border-collapse: collapse;
            position: relative;
            z-index: 1;
        }

        .calendar-table th,
        .calendar-table td {
            padding: 12px 8px;
            text-align: center;
            font-size: 0.95rem;
        }

        .calendar-table th {
            background-color: var(--table-header-bg);
            color: white;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        .calendar-table tr {
            border-bottom: 1px solid var(--table-border);
        }

        .calendar-table tr:nth-child(even) {
            background-color: var(--table-row-even);
        }

        .today {
            background-color: var(--today-bg) !important;
            font-weight: bold;
            border-left: 4px solid var(--accent-color);
        }

        .date-col {
            font-family: 'Amiri', serif;
            font-weight: bold;
            color: var(--primary-color);
        }

        .time-col {
            font-weight: 600;
        }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 0.8rem;
            color: #666;
            background-color: #f1f1f1;
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>Ramazon 2026</h1>
            <div class="region-badge">📍 {{ region|title }}</div>
        </header>

        <table class="calendar-table">
            <thead>
                <tr>
                    <th>Kun</th>
                    <th>Sana</th>
                    <th>Saharlik</th>
                    <th>Iftorlik</th>
                </tr>
            </thead>
            <tbody>
                {% for day in calendar %}
                <tr class="{% if day.is_today %}today{% endif %}">
                    <td>{{ day.day }}</td>
                    <td class="date-col">{{ day.date }}</td>
                    <td class="time-col">{{ day.suhoor }}</td>
                    <td class="time-col">{{ day.iftar }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <footer>
            Taqvim O‘zbekiston musulmonlari idorasi ma’lumotlari asosida tayyorlandi.
        </footer>
    </div>

    <script>
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();

        // Optional: Dynamic theme matching
        if (Telegram.WebApp.colorScheme === 'dark') {
            document.documentElement.style.setProperty('--bg-color', '#121212');
            document.documentElement.style.setProperty('--text-color', '#e0e0e0');
            document.documentElement.style.setProperty('--today-bg', '#332b00');
            document.documentElement.style.setProperty('--table-row-even', '#1e1e1e');
            document.documentElement.style.setProperty('--table-border', '#333');
            document.querySelector('.container').style.background = '#1e1e1e';
            document.querySelector('.watermark').style.color = 'rgba(255, 255, 255, 0.05)';
        }
    </script>

</body>

</html>
