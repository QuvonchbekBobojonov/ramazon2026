<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hadis va Oyatlar - Ramazon 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap');

        body {
            font-family: 'Outfit', sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }

        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .gradient-text {
            background: linear-gradient(135deg, #60a5fa 0%, #c084fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .arabic-font {
            font-family: 'Amiri', serif;
        }
    </style>
</head>

<body class="pb-10">
    <!-- Header -->
    <div class="px-5 pt-8 pb-6 sticky top-0 bg-[#0f172a]/80 backdrop-blur-md z-20 border-b border-white/5">
        <div>
            <h1 class="text-xl font-bold gradient-text">📖 Hadis va Oyatlar</h1>
            <p class="text-slate-400 text-[10px] uppercase tracking-wider font-bold">Kunlik eslatmalar</p>
        </div>
    </div>

    <div class="px-5 mt-6 space-y-6">
        {% for item in reminders_list %}
        <div class="glass rounded-3xl p-6 relative overflow-hidden group">
            <div
                class="absolute -right-4 -top-4 w-24 h-24 bg-blue-600/10 rounded-full blur-2xl group-hover:bg-blue-600/20 transition-all">
            </div>

            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                    <div
                        class="w-8 h-8 rounded-lg bg-blue-600/20 flex items-center justify-center text-blue-400 text-xs">
                        <i class="fas {% if item.type == 'Hadis' %}fa-quote-left{% else %}fa-book-open{% endif %}"></i>
                    </div>
                    <span class="text-xs font-bold uppercase tracking-widest text-slate-500">{{ item.type }}</span>
                </div>
                <span class="text-[10px] font-bold text-slate-600 bg-white/5 px-2 py-1 rounded-md">#{{ loop.index }}
                    KUN</span>
            </div>

            <p class="text-lg font-medium text-slate-100 leading-relaxed mb-4 italic">
                {{ item.content }}
            </p>

            <div class="flex flex-col gap-1 mb-6">
                <span class="text-xs text-blue-400 font-bold">— {{ item.source }}</span>
            </div>

            <div class="bg-black/20 rounded-2xl p-4 border border-white/5">
                <h4
                    class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                    Sharh
                </h4>
                <p class="text-sm text-slate-400 leading-relaxed">
                    {{ item.commentary }}
                </p>
            </div>
        </div>
        {% endfor %}
    </div>

    <script>
        Telegram.WebApp.ready();
    </script>
</body>

</html>
