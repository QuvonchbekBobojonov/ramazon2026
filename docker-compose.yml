services:
  redis:
    image: redis:7-alpine
    container_name: ramazon_redis
    restart: always
    ports:
      - "6379:6379"

  bot:
    build: .
    container_name: ramazon_bot
    restart: always
    depends_on:
      - redis
    volumes:
      - .:/app
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMINS: ${ADMINS}
      WEBHOOK_HOST: ${WEBHOOK_HOST}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
    ports:
      - "8080:8080"
